{% extends "base.html" %}

{% block title %}Home - Dummy Data Generator{% endblock %}

{% block content %}
<div class="home-container">
    <h2>Welcome to Dummy Data Generator</h2>
    <p>Generate realistic dummy data for your PostgreSQL databases with ease.</p>
    
    <select name="client" id="clientSelect" class="client-select">
        <option value="">Select a client...</option>
        <!-- Options will be populated dynamically -->
    </select>

    <div class="selectors-container">
        <div class="selector-container">
            <label for="clientCustomers">Customers:</label>
            <select name="customers" id="clientCustomers" class="client-data-select">
            <!-- Options will be populated dynamically -->
            </select>
        </div>
        <div class="selector-container">
            <label for="clientItems">Items:</label>
            <select name="items" id="clientItems" class="client-data-select">
                <!-- Options will be populated dynamically -->
            </select>
        </div>
        <div class="selector-container">
            <label for="clientSuppliers">Suppliers:</label>
            <select name="suppliers" id="clientSuppliers" class="client-data-select">
                <!-- Options will be populated dynamically -->
            </select>
        </div>
        <div class="selector-container">
            <label for="clientBuyers">Buyers:</label>
            <select name="buyers" id="clientBuyers" class="client-data-select">
                <!-- Options will be populated dynamically -->
            </select>
        </div>
    </div>

    <div class="generation-btn-container">
        <button id="generateSOButton" class="btn btn-primary">Generate Sales Orders</button>
        <button id="generatePOButton" class="btn btn-primary">Generate Purchase Orders</button>
    </div>
</div>

<script>
    const clientSelect = document.getElementById('clientSelect');

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const clients = await API.getClients();
            clients.forEach(client => {
                const option = document.createElement('option');
                option.value = client.id;
                option.textContent = `${client.client_name} (ID: ${client.client_id})`;
                clientSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error fetching clients:', error);
        }
    });

    clientSelect.addEventListener('change', async (event) => {
        const clientId = event.target.value;
        if (clientId) {
            try {
                const data = await API.getClientData(clientId);
                populateClientDataSelect('clientCustomers', data.customers);
                populateClientDataSelect('clientItems', data.items);
                populateClientDataSelect('clientSuppliers', data.suppliers);
                populateClientDataSelect('clientBuyers', data.buyers);
            } catch (error) {
                console.error('Error fetching client data:', error);
            }
        } else {
            clearClientDataSelect('clientCustomers');
            clearClientDataSelect('clientItems');
            clearClientDataSelect('clientSuppliers');
            clearClientDataSelect('clientBuyers');
        }
    });
</script>
{% endblock %}
