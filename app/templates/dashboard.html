{% extends "base.html" %}

{% block title %}Home - Dummy Data Generator{% endblock %}

{% block content %}
<div class="home-container">
    <h2>Welcome to Dummy Data Generator</h2>
    <p>Generate realistic dummy data for your PostgreSQL databases with ease.</p>
    
    <select name="client" id="clientSelect" class="client-select">
        <option value="">Select a client...</option>
        <!-- Options will be populated dynamically -->
    </select>

    <div class="selectors-container">
        <div class="selector-container">
            <label for="clientCustomers">Customers:</label>
            <select name="customers" id="clientCustomers" class="client-data-select">
                <option value="">Select a customer...</option>
            <!-- Options will be populated dynamically -->
            </select>
        </div>
        <div class="selector-container">
            <label for="lowerItemCount">Min items per order:</label>
            <input type="number" id="lowerItemCount" class="client-data-select" min="1" step="1" value="1" />
        </div>
        <div class="selector-container">
            <label for="upperItemCount">Max items per order:</label>
            <input type="number" id="upperItemCount" class="client-data-select" min="1" step="1" value="25" />
        </div>
        <div class="selector-container">
            <label for="salesOrderCount">Number of sales orders:</label>
            <input type="number" id="salesOrderCount" class="client-data-select" min="0" step="1" value="5" />
            <label style="margin-top:4px;">
                <input type="checkbox" id="randomSoCount" /> Random (1–10)
            </label>
        </div>
    </div>

    <div class="generation-btn-container">
        <button id="generateButton" class="btn btn-primary">Generate</button>
    </div>

    <p id="generationStatus"></p>
</div>

<script>
    const clientSelect = document.getElementById('clientSelect');
    const customerSelect = document.getElementById('clientCustomers');
    const lowerItemCountInput = document.getElementById('lowerItemCount');
    const upperItemCountInput = document.getElementById('upperItemCount');
    const salesOrderCountInput = document.getElementById('salesOrderCount');
    const randomSoCountCheckbox = document.getElementById('randomSoCount');
    const generateButton = document.getElementById('generateButton');
    const generationStatus = document.getElementById('generationStatus');

    let customerLookup = new Map();
    let clientLookup = new Map();

    randomSoCountCheckbox.addEventListener('change', () => {
        salesOrderCountInput.disabled = randomSoCountCheckbox.checked;
    });

    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const clients = await API.getClients();
            clients.forEach(client => {
                const option = document.createElement('option');
                option.value = client.id;
                option.textContent = `${client.client_name} (ID: ${client.client_id})`;
                clientSelect.appendChild(option);
                clientLookup.set(client.id, client);
            });
        } catch (error) {
            console.error('Error fetching clients:', error);
        }
    });

    function setStatus(message, isError = false) {
        generationStatus.textContent = message;
        generationStatus.style.color = isError ? '#b42318' : '#1f4e79';
    }

    async function generateOrders() {
        const clientId = clientSelect.value;
        const selectedCustomerKey = customerSelect.value;
        const selectedCustomer = customerLookup.get(selectedCustomerKey);
        const lowerItemCount = Number.parseInt(lowerItemCountInput.value, 10);
        const upperItemCount = Number.parseInt(upperItemCountInput.value, 10);
        const salesOrderCount = randomSoCountCheckbox.checked
            ? 0
            : Number.parseInt(salesOrderCountInput.value, 10);

        if (!clientId) {
            setStatus('Please select a client.', true);
            return;
        }

        if (!selectedCustomer) {
            setStatus('Please select a customer.', true);
            return;
        }

        if (!Number.isInteger(lowerItemCount) || lowerItemCount < 1) {
            setStatus('Min items per order must be at least 1.', true);
            return;
        }

        if (!Number.isInteger(upperItemCount) || upperItemCount < lowerItemCount) {
            setStatus('Max items per order must be greater than or equal to min items.', true);
            return;
        }

        if (!randomSoCountCheckbox.checked && (!Number.isInteger(salesOrderCount) || salesOrderCount < 1)) {
            setStatus('Number of sales orders must be at least 1.', true);
            return;
        }

        const payload = {
            client_id: clientId,
            customer_id: String(selectedCustomer.customer_id),
            customer_name: String(selectedCustomer.customer_name),
            company_id: String(clientLookup.get(clientId).client_id),
            lower_item_count: lowerItemCount,
            upper_item_count: upperItemCount,
            sales_order_count: salesOrderCount,
            ship_to_id: selectedCustomer.ship_to_id ? String(selectedCustomer.ship_to_id) : null
        };

        try {
            generateButton.disabled = true;
            setStatus(`Generating orders... (estimated time - ${Math.round(salesOrderCount * 1.8)} seconds)`);
            await API.generateOrders(payload);
            setStatus('Orders generated successfully. Download started.');
        } catch (error) {
            setStatus(`Failed to generate orders: ${error.message}`, true);
        } finally {
            generateButton.disabled = false;
        }
    }

    clientSelect.addEventListener("change", async (event) => {
        const clientId = event.target.value;

        if (clientId) {
            try {
                const customerData = await API.getClientCustomers(clientId);
                customerLookup = new Map();

                customerSelect.innerHTML = `<option value="">Select a customer...</option>`;
                customerData.forEach(customer => {
                    const option = document.createElement("option");
                    const customerKey = String(customer.ship_to_id ?? customer.customer_id);
                    option.value = customerKey;
                    option.textContent = `${customer.customer_name} (ID: ${customer.ship_to_id})`;
                    customerSelect.appendChild(option);
                    customerLookup.set(customerKey, customer);
                });
                setStatus('');
            } catch (error) {
                console.log("Error found when adding data", error);
                setStatus('Failed to load customer data for this client.', true);
            }
        } else {
            customerLookup = new Map();
            customerSelect.value = "";
            customerSelect.innerHTML = `<option value="">Select a customer...</option>`;
            setStatus('');
        }
    });

    generateButton.addEventListener('click', generateOrders);
</script>
{% endblock %}
