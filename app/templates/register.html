{% extends "base.html" %}

{% block title %}Register - Dummy Data Generator{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <div id="registerMessage"></div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
            let data = await API.register(username, email, password);
            document.getElementById('registerMessage').textContent = data;
        } catch (error) {
            document.getElementById('registerMessage').textContent = 'Registration failed: ' + error.message;
        }
    });
</script>
{% endblock %}
